name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Offline: replays recorded Mainnet history with MemWalMock and the deterministic engine.
      - run: npm test
      - run: npm run build
        env:
          WATCHSEAL_OFFLINE: "1"
